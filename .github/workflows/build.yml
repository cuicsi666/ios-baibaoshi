name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Debug project
        run: |
          echo "=== plist files ==="
          find . -name "*.plist" -not -path "./.git/*"
          echo "=== pbxproj INFOPLIST settings ==="
          grep -n "INFOPLIST\|GENERATE_INFO" Baibaoshi.xcodeproj/project.pbxproj | head -10 || echo "NOT FOUND"
          echo "=== Sources/Info.plist head ==="
          head -8 Sources/Info.plist 2>/dev/null || echo "NO PLIST FILE"

      - name: Build libssh2 + mbedtls (iOS arm64)
        run: |
          brew install cmake
          mkdir -p deps && cd deps
          [ -d mbedtls-src ] || git clone -q --depth 1 -b v3.6.2 --recursive https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          [ -d libssh2-src ] || git clone -q --depth 1 -b libssh2-1.11.1 https://github.com/libssh2/libssh2.git libssh2-src
          cmake -S mbedtls-src -B mbedtls-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build mbedtls-build -j
          cmake --install mbedtls-build
          cmake -S libssh2-src -B libssh2-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DCRYPTO_BACKEND=MbedTLS \
            -DCMAKE_INCLUDE_PATH=$PWD/prefix/include \
            -DCMAKE_LIBRARY_PATH=$PWD/prefix/lib
          cmake --build libssh2-build -j
          ls prefix/lib libssh2-build/src/*.a 2>/dev/null || true

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Baibaoshi.xcodeproj \
            -scheme Baibaoshi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Baibaoshi.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build.log | tail -40

      - name: Show errors on failure
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Baibaoshi.xcarchive/Products/Applications/Baibaoshi.app" build/Payload/
          cd build && zip -qry Baibaoshi.ipa Payload && ls -la Baibaoshi.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baibaoshi-ipa
          path: build/Baibaoshi.ipa
          retention-days: 30
