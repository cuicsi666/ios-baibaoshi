name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download BiliPlus embedded framework (from bili GitHub Release)
        run: |
          # 从哔哩public repo Release 下载最新内嵌框架
          FW_TAG="framework-v2-internal"
          REL_URL="https://api.github.com/repos/cuicsi666/pilipius-bili/releases/tags/${FW_TAG}"
          DL_URL=$(curl -s "$REL_URL" | python3 -c "import sys,json;d=json.load(sys.stdin);as=[a for a in d.get('assets',[]) if a['name']=='biliplus-internal-fw.tar.gz'];print(as[0]['browser_download_url'] if as else '')")
          echo "框架下载地址: $DL_URL"
          curl -sL "$DL_URL" -o /tmp/biliplus-internal-fw.tar.gz
          ls -lh /tmp/biliplus-internal-fw.tar.gz
          mkdir -p modules/Release
          tar xzf /tmp/biliplus-internal-fw.tar.gz -C modules/Release --strip-components=1
          echo "=== 解出的 xcframework ==="
          ls modules/Release/*.xcframework | wc -l
          ls modules/Release/ | head

      - name: Inject framework deps into project.yml
        run: |
          python3 - <<'EOF'
          import os
          mod_dir = "modules/Release"
          fws = sorted([d for d in os.listdir(mod_dir) if d.endswith(".xcframework")])
          block = "\n".join(f"      - framework: {mod_dir}/{f}\n        embed: true" for f in fws)
          yml = open("project.yml", encoding="utf-8").read()
          anchor = """    dependencies:
      - target: KeyboardExt
        embed: true"""
          assert anchor in yml, "锚点未找到"
          injected = "    dependencies:\n" + block + "\n      - target: KeyboardExt\n        embed: true"
          open("project.yml", "w", encoding="utf-8").write(yml.replace(anchor, injected))
          print(f"注入 {len(fws)} 个 framework 依赖")
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Debug project
        run: |
          echo "=== framework deps in pbxproj ==="
          grep -c "modules/Release" Baibaoshi.xcodeproj/project.pbxproj || echo "0"
          echo "=== plist files ==="
          find . -name "*.plist" -not -path "./.git/*" | head -5

      - name: Build libssh2 + mbedtls (iOS arm64)
        run: |
          brew install cmake
          mkdir -p deps && cd deps
          [ -d mbedtls-src ] || git clone -q --depth 1 -b v3.6.2 --recursive https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          [ -d libssh2-src ] || git clone -q --depth 1 -b libssh2-1.11.1 https://github.com/libssh2/libssh2.git libssh2-src
          cmake -S mbedtls-src -B mbedtls-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build mbedtls-build -j
          cmake --install mbedtls-build
          cmake -S libssh2-src -B libssh2-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DCRYPTO_BACKEND=MbedTLS \
            -DCMAKE_C_FLAGS="-DLIBSSH2_MBEDTLS -I$PWD/prefix/include" \
            -DCMAKE_INCLUDE_PATH=$PWD/prefix/include \
            -DCMAKE_LIBRARY_PATH=$PWD/prefix/lib
          cmake --build libssh2-build -j
          ls -la libssh2-build/src/*.a prefix/lib/*.a

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Baibaoshi.xcodeproj \
            -scheme Baibaoshi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Baibaoshi.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build.log | tail -40

      - name: Show errors on failure
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Baibaoshi.xcarchive/Products/Applications/Baibaoshi.app" build/Payload/
          cd build && zip -qry Baibaoshi.ipa Payload && ls -la Baibaoshi.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baibaoshi-ipa
          path: build/Baibaoshi.ipa
          retention-days: 30