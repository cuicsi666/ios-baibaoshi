name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download BiliPlus embedded framework (assets API)
        run: |
          # 私有repo asset 下载必须走 assets API(浏览器URL会404)
          FW_ASSET_ID="623810808"
          FW_URL="https://api.github.com/repos/cuicsi666/pilipius-bili/releases/assets/${FW_ASSET_ID}"
          echo "下载框架: $FW_URL"
          curl -sL -H "Authorization: token ${{ secrets.BIBAO_PAT }}" -H "Accept: application/octet-stream" "$FW_URL" -o /tmp/biliplus-internal-fw.tar.gz
          ls -lh /tmp/biliplus-internal-fw.tar.gz
          mkdir -p modules/Release
          tar xzf /tmp/biliplus-internal-fw.tar.gz -C modules/Release --strip-components=1
          echo "=== 解出的 xcframework ==="
          ls modules/Release/*.xcframework | wc -l

      - name: Inject framework deps into project.yml
        run: python3 scripts/inject_embed_deps.py .

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build libssh2 + mbedtls (iOS arm64)
        run: |
          brew install cmake
          mkdir -p deps && cd deps
          [ -d mbedtls-src ] || git clone -q --depth 1 -b v3.6.2 --recursive https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          [ -d libssh2-src ] || git clone -q --depth 1 -b libssh2-1.11.1 https://github.com/libssh2/libssh2.git libssh2-src
          cmake -S mbedtls-src -B mbedtls-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build mbedtls-build -j
          cmake --install mbedtls-build
          cmake -S libssh2-src -B libssh2-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DCRYPTO_BACKEND=MbedTLS \
            -DCMAKE_C_FLAGS="-DLIBSSH2_MBEDTLS -I$PWD/prefix/include" \
            -DCMAKE_INCLUDE_PATH=$PWD/prefix/include \
            -DCMAKE_LIBRARY_PATH=$PWD/prefix/lib
          cmake --build libssh2-build -j
          ls -la libssh2-build/src/*.a prefix/lib/*.a

      - name: Build iOS app (no archive, avoid bitcode_strip)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Baibaoshi.xcodeproj \
            -scheme Baibaoshi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO | tee build.log | tail -40
          APP=build/DerivedData/Build/Products/Release-iphoneos/Baibaoshi.app
          ls -d "$APP" && echo "APP 构建成功: $APP"

      - name: Show errors on failure
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40

      - name: Export IPA
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/Baibaoshi.app
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # ✅ 白屏根因修复: 引擎从主bundle根读 ICU 数据, 必须拷到 .app 根
          cp "$APP/Frameworks/Flutter.framework/icudtl.dat" "$APP/icudtl.dat" 2>/dev/null || echo "icudtl 拷贝失败!"
          ls -la "$APP/icudtl.dat"
          cd build && zip -qry Baibaoshi.ipa Payload && ls -la Baibaoshi.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baibaoshi-ipa
          path: build/Baibaoshi.ipa
          retention-days: 30