name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout 百宝箱
        uses: actions/checkout@v4

      - name: Checkout 哔哩 module (main-module)
        uses: actions/checkout@v4
        with:
          repository: cuicsi666/pilipius-bili
          ref: main-module
          token: ${{ secrets.BIBAO_PAT }}
          path: bili_module

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: false

      - name: Apply 哔哩 patches
        shell: pwsh
        run: |
          cd bili_module
          # patch.ps1 内部用 $env:GITHUB_WORKSPACE 拼patch路径, 嵌套目录需临时改指 module
          $env:GITHUB_WORKSPACE = (Get-Location).Path
          lib/scripts/patch.ps1 iOS

      - name: Convert 哔哩 to Flutter module (.ios/)
        run: |
          # 在全新空目录创建 module(可靠生成 .ios/), 再拷入哔哩代码
          mkdir -p bili_mod
          cd bili_mod
          flutter create --template=module --project-name biliplus --org com.cuicsi .
          echo "=== .ios 骨架 ==="; ls .ios/Flutter/podhelper.rb
          # 拷入哔哩业务代码与资源
          cp -R ../bili_module/lib ./lib
          cp ../bili_module/pubspec.yaml ./pubspec.yaml
          cp ../bili_module/pubspec.lock ./pubspec.lock || true
          [ -d ../bili_module/assets ] && cp -R ../bili_module/assets ./assets || true
          [ -d ../bili_module/tool ] && cp -R ../bili_module/tool ./tool || true
          ls lib | head -3
          # 打点/补丁已在 bili_module 里应用, 拷贝即含
          flutter pub get
          echo "=== podhelper ok ==="; ls .ios/Flutter/podhelper.rb
          # 把 module 目录放回预期路径
          cd ..
          rm -rf bili_module
          mv bili_mod bili_module
          ls bili_module/.ios/Flutter/podhelper.rb
          echo "=== pub get done ==="

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pod install (Flutter pods)
        run: |
          echo "=== pbxproj 里的 FLUTTER_APPLICATION_PATH ==="
          grep -n "FLUTTER_APPLICATION_PATH" Baibaoshi.xcodeproj/project.pbxproj | head -5 || echo "pbxproj里没有!"
          echo "=== 生成的 podspec script phase ==="
          grep -rn "xcode_backend\|script_phases\|Run Flutter Build" bili_module/.ios/Flutter/*.podspec | head -10 || true
          pod install --repo-update 2>&1 | tail -20
          echo "=== workspace ==="; ls -la Baibaoshi.xcworkspace

      - name: Build libssh2 + mbedtls (iOS arm64)
        run: |
          brew install cmake
          mkdir -p deps && cd deps
          [ -d mbedtls-src ] || git clone -q --depth 1 -b v3.6.2 --recursive https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          [ -d libssh2-src ] || git clone -q --depth 1 -b libssh2-1.11.1 https://github.com/libssh2/libssh2.git libssh2-src
          cmake -S mbedtls-src -B mbedtls-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build mbedtls-build -j
          cmake --install mbedtls-build
          cmake -S libssh2-src -B libssh2-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DCRYPTO_BACKEND=MbedTLS \
            -DCMAKE_C_FLAGS="-DLIBSSH2_MBEDTLS -I$PWD/prefix/include" \
            -DCMAKE_INCLUDE_PATH=$PWD/prefix/include \
            -DCMAKE_LIBRARY_PATH=$PWD/prefix/lib
          cmake --build libssh2-build -j
          ls -la libssh2-build/src/*.a prefix/lib/*.a

      - name: Build iOS app (workspace, no archive)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Baibaoshi.xcworkspace \
            -scheme Baibaoshi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO | tee build.log | tail -40
          APP=build/DerivedData/Build/Products/Release-iphoneos/Baibaoshi.app
          ls -d "$APP" && echo "APP 构建成功"

      - name: Show errors on failure
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40

      - name: Export IPA
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/Baibaoshi.app
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry Baibaoshi.ipa Payload && ls -la Baibaoshi.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baibaoshi-ipa
          path: build/Baibaoshi.ipa
          retention-days: 30