name: Baibaoshi
options:
  bundleIdPrefix: com.cuicsi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
    STRIP_BITCODE_FROM_COPIED_FILES: "NO"
targets:
  Baibaoshi:
    type: application
    platform: iOS
    sources:
      - path: Baibaoshi
        excludes:
          - "NES/InfoNES/mapper"
      - path: Resources
        excludes:
          - "ROMs"
          - "NESIcons"
          - "sites"
      - path: Resources/sites/vps
        type: folder
        buildPhase: resources
      - path: Resources/sites/panel
        type: folder
        buildPhase: resources
      - path: Resources/sites/g
        type: folder
        buildPhase: resources
      - path: Resources/ROMs
        type: folder
        buildPhase: resources
      - path: Resources/NESIcons
        type: folder
        buildPhase: resources
    dependencies:
      - target: KeyboardExt
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuicsi.baibaoshi
        MARKETING_VERSION: "28.0"
        CURRENT_PROJECT_VERSION: "41"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Baibaoshi/Support/Baibaoshi.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Baibaoshi/Support/Baibaoshi-Bridging-Header.h
        OTHER_LDFLAGS: "-lssh2 -lmbedtls -lmbedx509 -lmbedcrypto"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/deps/prefix/lib $(PROJECT_DIR)/deps/libssh2-build/src"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/deps/libssh2-src/include $(PROJECT_DIR)/deps/prefix/include"
    info:
      path: Baibaoshi/Info.plist
      properties:
        CFBundleDisplayName: 星辰
        CFBundleName: 星辰
        CFBundleShortVersionString: "28.0"
        CFBundleVersion: "41"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        NSLocationAlwaysAndWhenInUseUsageDescription: 用于保持 App 后台常驻（低功耗模式，仅保活用途，不采集不上报位置），确保充电播报、XUI 蓝牙、流文连接不中断
        NSLocationWhenInUseUsageDescription: 用于保持 App 后台常驻（低功耗模式，仅保活用途）
        NSBluetoothAlwaysUsageDescription: 连接 XUI 板子（遥控/手柄/流文文字流）与蓝牙中继上网
        NSBluetoothPeripheralUsageDescription: 连接 XUI 板子
        NSMotionUsageDescription: 用于「水平仪」工具读取设备姿态，仅在工具页面内使用，不上传
        NSPhotoLibraryAddUsageDescription: 用于把「二维码/条码生成器」生成的图片保存到相册
        NSMicrophoneUsageDescription: 语音遥控需要使用麦克风识别指令（远程控制模块）
        NSSpeechRecognitionUsageDescription: 语音遥控需要语音识别，把你说的话转成设备指令
        NSLocalNetworkUsageDescription: 用于连接公网/内网网关，远程控制你的安卓设备
        CFBundleURLTypes:
          - CFBundleURLName: com.cuicsi.baibaoshi
            CFBundleURLSchemes:
              - rccontrol
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
          CFBundleAlternateIcons:
            AppIcon1:
              CFBundleIconFiles: [AppIcon1]
            AppIcon2:
              CFBundleIconFiles: [AppIcon2]
            AppIcon3:
              CFBundleIconFiles: [AppIcon3]
            AppIcon4:
              CFBundleIconFiles: [AppIcon4]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  KeyboardExt:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuicsi.baibaoshi.keyboard
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: Baibaoshi/Support/KeyboardExt.entitlements
    info:
      path: KeyboardExt/Info.plist
      properties:
        CFBundleDisplayName: 星辰键盘
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
schemes:
  Baibaoshi:
    build:
      targets:
        Baibaoshi: all
        KeyboardExt: all
    run:
      config: Debug
    archive:
      config: Release
