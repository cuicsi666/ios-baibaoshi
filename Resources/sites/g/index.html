<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF" id="metaTheme">
<title>日子闪闪发光</title>
<script src="lunar.js?v=3"></script>
<script src="data/idioms-baby.js?v=3"></script>
<script src="data/idioms-self.js?v=3"></script>
<script src="data/love-wife.js?v=3"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

/* ===== 主题变量 ===== */
body{
  --a1:#FF8E53;--a2:#FFC55C;--bgA:#FFF8EF;--bgB:#FFEFD9;
  --ink:#4A3222;--sub:#A08B78;--ring:#FFB055;--tint:rgba(255,142,83,.10);
  font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
  color:var(--ink);min-height:100vh;background:linear-gradient(160deg,var(--bgA),var(--bgB));
  transition:background .7s ease;padding:0 16px calc(34px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
body[data-theme="baby"]{--a1:#FF8E53;--a2:#FFC55C;--bgA:#FFF8EF;--bgB:#FFEFD9;--ink:#4A3222;--sub:#A08B78;--ring:#FFB055;--tint:rgba(255,142,83,.10)}
body[data-theme="wife"]{--a1:#FF6B9D;--a2:#FF9AB8;--bgA:#FFF5F8;--bgB:#FFE7EE;--ink:#4A2135;--sub:#B08496;--ring:#FF8EAC;--tint:rgba(255,107,157,.10)}
body[data-theme="self"]{--a1:#4F7CFF;--a2:#8E6CFF;--bgA:#F4F7FF;--bgB:#E9EEFF;--ink:#22304F;--sub:#8290B4;--ring:#6C8CFF;--tint:rgba(79,124,255,.10)}

.container{max-width:560px;margin:0 auto;position:relative;z-index:2}

/* ===== 背景装饰 ===== */
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0;transition:background .7s ease}
.g1{width:300px;height:300px;top:-80px;left:-90px;background:var(--a2);animation:drift1 14s ease-in-out infinite alternate}
.g2{width:260px;height:260px;bottom:-60px;right:-80px;background:var(--a1);opacity:.34;animation:drift2 17s ease-in-out infinite alternate}
.g3{width:180px;height:180px;top:38%;right:-70px;background:var(--a2);opacity:.28;animation:drift1 20s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(36px,28px) scale(1.12)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-30px,-36px) scale(1.15)}}
.floater{position:fixed;bottom:-70px;pointer-events:none;z-index:0;opacity:.34;animation:rise linear infinite;will-change:transform,opacity}
@keyframes rise{to{transform:translateY(-112vh) rotate(24deg);opacity:0}}

/* ===== 顶栏 ===== */
.datebar{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 0;font-size:12.5px;color:var(--sub)}
.datebar .lunar{font-size:12px;opacity:.85}
.header{text-align:center;margin:18px 0 20px;animation:fadeUp .6s ease both}
.header h1{font-size:27px;font-weight:800;letter-spacing:4px;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:12.5px;color:var(--sub);margin-top:5px;letter-spacing:1px}

/* ===== 人物切换 ===== */
.pswitch{display:flex;gap:10px;margin-bottom:18px;animation:fadeUp .6s .08s ease both}
.pcard{flex:1;border:none;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1.5px solid rgba(0,0,0,.04);cursor:pointer;font-family:inherit;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),border-color .3s,box-shadow .3s;position:relative}
.pcard .p-face{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;
  box-shadow:0 3px 10px -2px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pcard .p-face img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .p-name{font-size:14.5px;font-weight:700;color:var(--ink)}
.pcard .p-sub{font-size:10.5px;color:var(--sub)}
.pcard:active{transform:scale(.96)}
.pcard.on{border-color:transparent;transform:translateY(-3px);box-shadow:0 10px 24px -6px var(--tint),0 4px 14px rgba(0,0,0,.05)}
.pcard.on::before{content:'';position:absolute;inset:-1.5px;border-radius:18px;padding:1.5px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pcard.on .p-face{transform:scale(1.16) rotate(-4deg)}
.pcard .p-badge{position:absolute;top:-7px;right:-5px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;
  font-size:9px;padding:2px 7px;border-radius:99px;font-weight:600;box-shadow:0 3px 8px -2px var(--a1);opacity:0;transform:scale(.5);transition:all .3s}
.pcard.on .p-badge{opacity:1;transform:scale(1)}

/* ===== 通用卡片 ===== */
.panel{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:20px 18px;
  box-shadow:0 8px 28px -10px rgba(0,0,0,.07);margin-bottom:14px;position:relative;overflow:hidden}
.card-anim{animation:fadeUp .55s ease both}
main[data-dir="1"] .card-anim,main[data-dir="-1"] .card-anim{animation-name:slideX}
main[data-dir="1"]{--sx:52px}
main[data-dir="-1"]{--sx:-52px}
@keyframes slideX{from{opacity:0;transform:translateX(var(--sx))}to{opacity:1;transform:translateX(0)}}
.panel:nth-of-type(1){animation-delay:.12s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* ===== Hero ===== */
.hero{display:flex;align-items:center;gap:16px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));
  padding:2.5px;flex-shrink:0;cursor:pointer;
  box-shadow:0 8px 20px -6px var(--a1);user-select:none;-webkit-user-select:none;transition:transform .2s}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.9)}
.avatar:active{transform:scale(.9)}
.avatar.bounce{animation:bounce .65s cubic-bezier(.28,1.6,.4,1)}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-10deg)}55%{transform:scale(.94) rotate(6deg)}100%{transform:scale(1)}}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:7px}
.hero-tag{font-size:10.5px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));padding:2.5px 9px;border-radius:99px;font-weight:600;letter-spacing:.5px}
.hero-sub{font-size:12px;color:var(--sub);margin-top:4px}
.hero-days{text-align:right;flex-shrink:0}
.hero-days .num{font-size:42px;font-weight:800;line-height:1;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-days .unit{font-size:12px;color:var(--sub);margin-top:3px;letter-spacing:2px}

/* ===== 成长时长 ===== */
.sec-t{font-size:12.5px;color:var(--sub);font-weight:600;letter-spacing:2px;display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.sec-t::before,.sec-t::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--tint),transparent);border:none}
.sec-t::after{background:linear-gradient(90deg,var(--tint),transparent)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stat{background:var(--tint);border-radius:14px;padding:10px 2px;text-align:center;perspective:220px}
.stat .n{font-size:20px;font-weight:800;color:var(--a1);display:inline-block;
  transition:transform .11s ease-in,opacity .11s ease-in;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.stat .n.tick{transform:rotateX(86deg) translateY(-2px);opacity:.12}
.stat .u{font-size:10.5px;color:var(--sub);margin-top:2px}

/* ===== 生日倒计时 ===== */
.bd{display:flex;align-items:center;gap:16px}
.ringwrap{position:relative;width:104px;height:104px;flex-shrink:0}
.ringwrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--tint);stroke-width:9}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.3,.7,.3,1)}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-mid .pct{font-size:19px;font-weight:800;color:var(--a1)}
.ring-mid .pl{font-size:9.5px;color:var(--sub)}
.bd-info{flex:1;min-width:0}
.bd-nums{display:flex;gap:14px;margin:6px 0 8px}
.bd-nums .bn{text-align:center}
.bd-nums .bn .n{font-size:24px;font-weight:800;color:var(--a1)}
.bd-nums .bn .u{font-size:10.5px;color:var(--sub)}
.bd-date{font-size:12.5px;color:var(--ink);font-weight:600}
.bd-tip{font-size:11px;color:var(--sub);margin-top:4px}

/* ===== 签卡（成语/爱语）===== */
.qcard{background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:22px;padding:22px 20px 16px;margin-bottom:14px;
  color:#fff;box-shadow:0 14px 30px -12px var(--a1);position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:transform .25s}
.qcard:active{transform:scale(.975)}
.qcard::before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);top:-60px;right:-40px}
.qcard::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.10);bottom:-40px;left:-20px}
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;opacity:.92;position:relative;z-index:1}
.q-no{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px;font-weight:600;letter-spacing:.5px}
.q-body{min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:1;
  transition:transform .24s ease,opacity .24s ease}
.q-word{font-size:33px;font-weight:800;letter-spacing:6px;text-indent:6px;text-shadow:0 2px 10px rgba(0,0,0,.10)}
.q-sub{font-size:13px;margin-top:10px;opacity:.94;letter-spacing:1px}
.q-foot{text-align:center;font-size:10.5px;opacity:.75;letter-spacing:1.5px;margin-top:12px;position:relative;z-index:1}
.qcard.flipping .q-body{transform:rotateY(90deg) scale(.9);opacity:0}
.q-hint{position:absolute;top:14px;right:16px;font-size:16px;animation:tap 1.8s ease infinite;z-index:1;opacity:.9}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ===== 结婚纪念日 ===== */
.wed-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wed-item{background:var(--tint);border-radius:13px;padding:9px 6px;text-align:center}
.wed-item .l{font-size:10.5px;color:var(--sub)}
.wed-item .v{font-size:13.5px;font-weight:700;color:var(--a1);margin-top:2px}
.wed-count{display:flex;justify-content:center;gap:13px;background:var(--tint);border-radius:14px;padding:11px 4px;margin-bottom:8px}
.wed-count .c{text-align:center}
.wed-count .c .n{font-size:21px;font-weight:800;color:var(--a1)}
.wed-count .c .u{font-size:10px;color:var(--sub)}
.wed-next{text-align:center;font-size:11.5px;color:var(--sub)}

/* ===== 页脚 ===== */
.footer{text-align:center;font-size:11px;color:var(--sub);margin-top:22px;letter-spacing:1px;animation:fadeUp .6s .3s ease both}
.footer .beat{display:inline-block;animation:beat 1.4s ease infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.2)}}

/* ===== 爱心粒子 ===== */
.heart-pop{position:fixed;pointer-events:none;z-index:99;font-size:19px;transform:translate(-50%,-50%);
  animation:heartPop .9s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes heartPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.35) rotate(var(--rot))}}

@media(max-width:390px){
  .stats{gap:5px}.stat .n{font-size:16px}.stat{border-radius:11px;padding:8px 1px}
  .hero-days .num{font-size:36px}
  .q-word{font-size:29px}
}
</style>
</head>
<body data-theme="baby">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="container">
  <div class="datebar">
    <span id="todaySolar">—</span>
    <span class="lunar" id="todayLunar">—</span>
  </div>
  <div class="header">
    <h1>日子闪闪发光</h1>
    <p>每一天，都值得被记得 ✨</p>
  </div>
  <div class="pswitch" id="pswitch">
    <button class="pcard on" data-key="baby" id="pc-baby">
      <span class="p-badge">成长中</span>
      <span class="p-face"><img src="data/avatar-baby.jpg?v=2" alt="宝宝"></span><span class="p-name">宝宝</span><span class="p-sub">我家小王子</span>
    </button>
    <button class="pcard" data-key="wife" id="pc-wife">
      <span class="p-badge">最爱的她</span>
      <span class="p-face"><img src="data/avatar-wife.jpg?v=3" alt="媳妇"></span><span class="p-name">媳妇</span><span class="p-sub">我的女王</span>
    </button>
    <button class="pcard" data-key="self" id="pc-self">
      <span class="p-badge">奋斗中</span>
      <span class="p-face"><img src="data/avatar-self.jpg?v=2" alt="老大"></span><span class="p-name">老大</span><span class="p-sub">顶梁柱</span>
    </button>
  </div>
  <main id="main"></main>
  <div class="footer">为最爱的家 <span class="beat">❤️</span> since 2021</div>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
